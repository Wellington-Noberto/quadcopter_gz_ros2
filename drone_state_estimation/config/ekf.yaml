ekf_filter_node:
  ros__parameters:
    # The frequency, in Hz, at which the filter will output a position estimate.
    frequency: 30.0

    # Use 2D mode? Set to true for planar motion.
    two_d_mode: false
    # Whether to publish acceleration state.
    publish_acceleration: true
    # Whether to publish TF.
    publish_tf: true

    # Frame settings
    map_frame: map              # Global frame (e.g., GPS or SLAM)
    odom_frame: odom            # Local odometry frame
    base_link_frame: base_link  # Robot base frame
    world_frame: odom           # Frame used for output pose

    # --------------------
    # Sensor configurations
    # --------------------
    imu0: x500/imu
    imu0_config: [
      false, false, false,  	# Position (X Y Z)
      false, false, false,		    # Orientation (roll pitch yaw)
      false, false, false,   	# Linear velocity (X Y Z)
      true,  true,  true,   	# Angular velocity (X Y Z)
      true, true, true			  # Linear acceleration (X Y Z)
    ]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 5
    imu0_remove_gravitational_acceleration: true


    # Pressure sensor (altitude/depth as Z position)
    pose0: /x500/altitude
    pose0_config: [
      false, false, true,    # Position (Z only)
      false, false, false,   # Orientation (roll pitch yaw)
      false, false, false,   # Velocity
      false, false, false,   # Angular velocity (X Y Z)
      false, false, false    # Acceleration
    ]
    pose0_differential: false
    pose0_relative: false
    pose0_queue_size: 5